name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --watchAll=false

      - name: Read app version
        id: app
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          # Actions sets CI=true, which makes CRA treat warnings as errors.
          # Two remain, both emitted by webpack rather than eslint:
          #   "Critical dependency: the request of a dependency is an expression"
          # They come from ilib's dynamic require() inside @enact/moonstone, so
          # no eslint-disable can silence them and they are not ours to fix.
          # The source lint warnings this flag used to cover are gone as of the
          # th0enix merge. Drop this if the Enact dependency stops emitting them.
          CI: false
        run: npm run build

      - name: Install webOS CLI
        run: npm install -g @webosose/ares-cli

      - name: Package ipk
        run: ares-package build service

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: com.tvh.app_${{ steps.app.outputs.version }}
          path: '*.ipk'
          if-no-files-found: error
